[project]
name = "qa-agents"
version = "0.1.0"
description = "AI-powered QA news research agent with podcast generation using CrewAI"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.30.0",
    "crewai-tools>=0.1.0",
    "python-dotenv>=1.0.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "tavily-python>=0.3.0",
    "pyttsx3>=2.90.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"